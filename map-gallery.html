<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Map Gallery</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Map Gallery</h1>
        <div class="row">
            <div class="col-md-4 mb-4">
                <a href="images/ColinStiles_MapGallery_Set1.pdf" target="_blank" class="card-link">
                    <img src="images/set-1.png" class="card-img-top" alt="Map Gallery Set 1">
                    <div class="card-body">
                        <h5 class="card-title">Set 1</h5>
                    </div>
                </a>
            </div>
            <div class="col-md-4 mb-4">
                <a href="images/ColinStiles_MapGallery_Set2.pdf" target="_blank" class="card-link">
                    <img src="images/set-2.png" class="card-img-top" alt="Map Gallery Set 2">
                    <div class="card-body">
                        <h5 class="card-title">Set 2</h5>
                    </div>
                </a>
            </div>
            <!-- Repeat for other sets -->
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
